; ============================================================
;  ESP32 Access Control System — PlatformIO Configuration
;  v0.3 (Sprint 1 CI/CD)
; ============================================================
;
; 3 environment:
;   esp32dev       — board lama (ESP32 klasik), DIPERTAHANKAN untuk kompatibilitas prototyping v0.1
;   esp32s3_16mb   — TARGET PRODUKSI v0.3 (ESP32-S3-WROOM-1-N16, 16MB). Dulu belum ada -> temuan C-c
;   native         — test unit di PC (tanpa hardware), dijalankan `pio test -e native` di CI
;
; CI (firmware-ci.yml): `pio test -e native` (gerbang test) + `pio run -e esp32s3_16mb` (compile check).

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.filesystem = littlefs
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
build_unflags =
    -std=gnu++11

; ------------------------------------------------------------
;  TARGET PRODUKSI v0.3 — ESP32-S3-WROOM-1-N16 (16MB Flash, tanpa PSRAM)
;  Alokasi pin final ada di KEPUTUSAN_ARSITEKTUR_v0.3.md §1.1 (GPIO33/40/47/48/EN).
;  Skema partisi 16MB (app0/app1/littlefs) menyusul di Sprint 6 firmware.
; ------------------------------------------------------------
[env:esp32s3_16mb]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_TARGET_PRODUCTION_ESP32S3_N16
build_unflags =
    -std=gnu++11

; ------------------------------------------------------------
;  NATIVE — unit test logika murni di PC, tanpa hardware ESP32.
;  Hanya menguji kode yang BEBAS dependensi Arduino (lihat firmware/src/util/).
;  Konvensi test: folder firmware/test/test_*/ dengan Unity (bawaan PlatformIO).
; ------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
