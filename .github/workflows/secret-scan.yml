# Secret scanning — gerbang merge (KEPUTUSAN §7.1 W6).
# Repo menyimpan config MQTT/DB; .env sudah di-.gitignore, tapi riwayat, contoh config, dan
# kredensial yang tak sengaja ter-commit tetap perlu discan tiap PR.
name: secret-scan

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
