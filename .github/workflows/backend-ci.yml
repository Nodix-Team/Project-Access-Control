# Backend CI — gerbang merge (KEPUTUSAN §7.1 W1).
# pytest dijalankan di atas MySQL service container SUNGGUHAN (bukan SQLite) supaya ENUM, CHECK,
# dan func.timestampdiff() benar-benar ter-eksekusi engine nyata (temuan C-a). Plus lint ruff.
name: backend-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [dev, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: access_control_test
          # Paksa UTC di server (aturan R2) supaya CURRENT_TIMESTAMP tidak beda zona dengan
          # server_ts yang ditulis backend dalam UTC eksplisit.
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      TEST_DATABASE_URL: "mysql+pymysql://root:root@127.0.0.1:3306/access_control_test"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Force MySQL session timezone to UTC (aturan R2)
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL time_zone = '+00:00';"

      - name: Run tests (pytest @ MySQL)
        run: pytest -q
